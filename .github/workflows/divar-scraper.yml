name: Divar URL Scraper

on:
  workflow_dispatch:
    inputs:
      search_url:
        description: "Divar search URL"
        required: true
        type: string

      max_scrolls:
        description: "Maximum number of scrolls"
        required: false
        default: "80"
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Selenium
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Run Divar scraper
        run: |
          python divar_url_scraper.py \
            --url "${{ inputs.search_url }}" \
            --max-scrolls "${{ inputs.max_scrolls }}"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: divar-listing-urls
          path: |
            divar_listing_urls.txt
            divar_listing_urls.csv
          if-no-files-found: error
