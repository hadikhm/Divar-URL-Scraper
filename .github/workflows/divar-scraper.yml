name: Divar URL Scraper

on:
  workflow_dispatch:
    inputs:
      search_urls_source:
        description: "GitHub API URL of the search URL file"
        required: false
        default: "https://api.github.com/repos/hadikhm/Chatgptuse/contents/carpet-project/search_urls.md"
        type: string
      max_scrolls:
        description: "Maximum number of scrolls per search"
        required: false
        default: "80"
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install Selenium
        run: |
          python -m pip install --upgrade pip
          pip install selenium
      - name: Download search URL list
        env:
          CARPET_REPO_TOKEN: ${{ secrets.CARPET_REPO_TOKEN }}
        run: |
          test -n "$CARPET_REPO_TOKEN"
          curl -fL \
            -H "Authorization: Bearer $CARPET_REPO_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "${{ inputs.search_urls_source }}" \
            -o search_urls.md
      - name: Run Divar scraper
        run: python divar_url_scraper.py --url-file search_urls.md --max-scrolls "${{ inputs.max_scrolls }}"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: divar-listing-urls
          path: |
            divar_listing_urls.txt
            divar_listing_urls.csv
          if-no-files-found: error
      - name: Publish results to Carpet project
        env:
          CARPET_REPO_TOKEN: ${{ secrets.CARPET_REPO_TOKEN }}
        run: |
          test -n "$CARPET_REPO_TOKEN"
          git clone "https://x-access-token:${CARPET_REPO_TOKEN}@github.com/hadikhm/Chatgptuse.git" carpet-repo
          mkdir -p carpet-repo/carpet-project/raw
          cp divar_listing_urls.txt carpet-repo/carpet-project/raw/divar_listing_urls.txt
          cp divar_listing_urls.csv carpet-repo/carpet-project/raw/divar_listing_urls.csv
          cd carpet-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carpet-project/raw/divar_listing_urls.txt carpet-project/raw/divar_listing_urls.csv
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update raw Divar listing URLs"
            git push origin main
          fi
